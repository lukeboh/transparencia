# Testa o servidor MCP e gera o pacote .mcpb.
#   - push/PR que mexa em mcp/ ou src/tse/: testes + .mcpb como artefato da execução;
#   - tag mcp-vX.Y.Z: além disso, cria a Release no GitHub com o .mcpb anexado e,
#     se o segredo NPM_TOKEN existir, publica no npm (habilita `npx tse-transparencia-mcp`).
name: MCP

on:
  push:
    branches: [main]
    tags: ['mcp-v*']
    paths: ['mcp/**', 'src/tse/**', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['mcp/**', 'src/tse/**', '.github/workflows/mcp.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar-e-empacotar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run pack:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: tse-transparencia-mcp
          path: |
            mcp/dist/*.mcpb
            mcp/dist/index.js

      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          versao="$(node -p "require('./package.json').version")"
          test "mcp-v${versao}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != package.json ${versao}"; exit 1; }
      - name: Release no GitHub
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mcp/dist/*.mcpb
          generate_release_notes: true
      - name: Publicar no npm
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN não configurado — publicação no npm pulada."; exit 0; fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --access public
